# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# This project uses the framework APIs only, no AndroidX/Support libraries.
android.useAndroidX=false
android.enableJetifier=false

# Suppress noise for a project that intentionally keeps the legacy Java sources.
android.nonTransitiveRClass=false

# The legacy sources use R.id constants in switch statements, which requires
# final resource IDs (AGP 8 makes them non-final by default).
android.nonFinalResIds=false
